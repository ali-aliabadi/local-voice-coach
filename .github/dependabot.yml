# Pull requests for outdated or vulnerable dependencies, grouped so a version bump is never
# a PR of its own. Each one runs `make check` in CI, pip-audit included, before anyone
# merges it.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      # The routine ones together; a major version - an API that may have changed - apart,
      # so it never holds the routine ones back.
      python:
        update-types: [minor, patch]
      python-major:
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]
