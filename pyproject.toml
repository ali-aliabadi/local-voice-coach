[project]
name = "local-voice-coach"
version = "0.1.0"
description = "Spoken interview practice that measures your hesitation. Local, private, free."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "kokoro-onnx>=0.5.0",
    "numpy>=2.4.6",
    "onnxruntime>=1.26.0",
    "openai>=2.41.0",
    "starlette>=0.41",
    "uvicorn>=0.32",
    "websockets>=13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["coach", "coach.modes"]

# ---- style: ruff is the standard. `ruff check .` and `ruff format .` ----
[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
# Snippets in the docs are illustrative; don't let the formatter rewrite them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle - PEP 8
    "F",         # pyflakes - real errors, unused imports and names
    "I",         # isort - import order
    "UP",        # pyupgrade - don't write 3.8 in a 3.12 project
    "B",         # bugbear - likely bugs
    "SIM",       # simplify - the ponytail rules a linter can check
    "C4",        # comprehensions
    "RET",       # returns
    "ARG",       # unused arguments
]
ignore = [
    "E501",      # line length is ruff format's job, not a lint error
    "B008",      # we do call functions in defaults deliberately
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]    # tests import mid-file on purpose, to reset module state
