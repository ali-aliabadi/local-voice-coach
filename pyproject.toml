[project]
name = "local-voice-coach"
version = "0.1.0"
description = "Spoken English practice that measures your hesitation. Local, private, free."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "kokoro-onnx>=0.5.0",
    "numpy>=2.4.6",
    "onnxruntime>=1.26.0",
    "openai>=2.41.0",
    "pillow>=11",
    "starlette>=0.41",
    "uvicorn>=0.32",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]  # `uv sync` installs it; the Docker image leaves it out

[build-system]
requires = ["setuptools>=77"]  # the SPDX license string (PEP 639)
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["coach", "coach.modes"]

# ---- style: ruff is the standard. `ruff check .` and `ruff format .` ----
[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
# Snippets in the docs are illustrative; don't let the formatter rewrite them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle - PEP 8
    "F",         # pyflakes - real errors, unused imports and names
    "I",         # isort - import order
    "UP",        # pyupgrade - don't write 3.8 in a 3.12 project
    "B",         # bugbear - likely bugs
    "SIM",       # simplify - the ponytail rules a linter can check
    "C4",        # comprehensions
    "RET",       # returns
    "ARG",       # unused arguments
    "C90",       # mccabe - cyclomatic complexity
    "PL",        # pylint - function size, branches, arguments, and its own bug checks
    "S",         # bandit - security
    "N",         # pep8-naming
    "PT",        # pytest style
    "PTH",       # pathlib over os.path and open()
    "RUF",       # ruff's own checks
]
ignore = [
    "E501",      # line length is ruff format's job, not a lint error
    "B008",      # we do call functions in defaults deliberately
    "PLR2004",   # a threshold in a comparison reads clearer inline; ones that mean something are named
    "S608",      # SQL is composed from module constants only; every value is a ? parameter
    "S311",      # `random` picks topics and voices, never anything secret
    "RUF001",    # the dashes and quotes in user-facing text are typography, on purpose
]

# Relay's limits, in Python terms: a function that outgrows them is split, not excused.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-positional-args = 5  # past five, a call stops saying what it passes; name the rest
max-args = 10            # keyword-only extras with defaults read fine at every call
max-branches = 12
max-statements = 50
max-returns = 6

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",      # assert is how pytest checks
    "PLR0913",   # parametrized tests take one argument per column
]

# ---- tests: `make check` runs pytest with coverage; `make e2e` the end-to-end test ----
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers", "--strict-config", "-m", "not e2e"]
markers = ["e2e: the real server and models over a real socket (`make e2e`)"]
filterwarnings = ["error", "ignore:Using `httpx`:DeprecationWarning"]

[tool.coverage.run]
source = ["coach"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 65  # where it stands; raise it as tests are added, never lower it

# ---- types: mypy over everything; the app fully annotated, the tests' bodies checked ----
[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts", "main.py"]
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
strict_equality = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["tests.*", "check_lines"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["kokoro_onnx.*", "faster_whisper.*"]  # no type information published
ignore_missing_imports = true
